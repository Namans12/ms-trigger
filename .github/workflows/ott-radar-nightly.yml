name: OTT Radar Nightly Refresh

on:
  schedule:
    # 2:00 AM IST (20:30 UTC previous day) every day
    - cron: "30 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: ott-radar
  cancel-in-progress: false

jobs:
  nightly-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OTT Radar (DB write only, no notifications)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: "true"
          REGION: IN
          LANGUAGES: hi,en
          POPULAR_MIN_POPULARITY: "25"
          RELEASE_TIMEZONE: Asia/Kolkata
        run: python releasebot.py
