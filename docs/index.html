<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotlight</title>
<meta name="description" content="Spotlight has moved — find it at spotlightx.vercel.app" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #e8e1d8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 420px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: #a8a29a;
  }
  a.button {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 999px;
    background: #e8b04b;
    color: #000;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: filter 0.15s ease;
  }
  a.button:hover, a.button:focus-visible {
    filter: brightness(1.1);
  }
  .repo-link {
    margin-top: 8px;
    font-size: 12px;
  }
  .repo-link a {
    color: #a8a29a;
  }
</style>
</head>
<body>
  <main>
    <h1>Spotlight has moved</h1>
    <p>This GitHub Pages site is retired — the app itself lives on Vercel.</p>
    <a class="button" href="https://spotlightx.vercel.app/">
      Open Spotlight →
    </a>
    <p class="repo-link"><a href="https://github.com/Namans12/ms-trigger">View the source on GitHub</a></p>
  </main>
</body>
</html>
